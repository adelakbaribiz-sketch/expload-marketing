name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: file:./db/custom.db
  NEXTAUTH_SECRET: ci-only-secret-not-used-in-production-please-change-32chars
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Typecheck, Lint, Unit/Integration Tests, DB Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client + create schema
        run: |
          bun run db:generate
          bun run db:push

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit + integration tests (bun test)
        run: bun test

      - name: Database integrity check
        run: bun run db:integrity-check

      - name: Security checks (static — no live server in this job)
        run: bun run security-check

      - name: Dependency vulnerability scan (bun audit)
        # GHSA-ggr8-5vv4-36mx (deepmerge-ts) and GHSA-38f7-945m-qr2g (effect)
        # are transitive to prisma's CLI-only @prisma/config — build/migrate
        # -time tooling, never in the runtime `@prisma/client` bundle this
        # app actually ships (see SECURITY-BASELINE.md §23) — and have no
        # fix available without a Prisma 7.x major bump. Ignored explicitly
        # (not silenced globally) so any NEW advisory still fails this step.
        run: bun audit --ignore=GHSA-ggr8-5vv4-36mx --ignore=GHSA-38f7-945m-qr2g

      - name: Dev/prod schema drift check
        run: bun run db:schemas-in-sync

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client + create schema
        run: |
          bun run db:generate
          bun run db:push

      - name: Production build
        run: bun run build:webpack

  api-and-security-live:
    name: Live API integration + security checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client + create schema
        run: |
          bun run db:generate
          bun run db:push

      - name: Build
        run: bun run build:webpack

      - name: Start production server
        run: |
          nohup bun run start:bun > server.log 2>&1 &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health/live > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start in time"
          cat server.log
          exit 1

      - name: Security checks (including live adversarial checks)
        run: bun run security-check

      - name: API integration checks (critical paths)
        run: bun run scripts/api-integration-checks.ts

      - name: Print server log on failure
        if: failure()
        run: cat server.log

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Generate Prisma client + create schema
        run: |
          bun run db:generate
          bun run db:push

      - name: Build for E2E
        run: bun run e2e:build

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Artifact — build the real production image (same Dockerfile
  # docker-compose.prod.yml/deploy.sh/deploy-vps.sh use) and push it to
  # GHCR, tagged by commit SHA (for rollback reference / historical
  # inspection) and `latest`. Only runs once every quality/build/live/e2e
  # gate above has passed, and only for pushes to main — never for PRs
  # (forks don't get `packages: write` on GITHUB_TOKEN, and a PR build
  # isn't a release candidate anyway).
  # --------------------------------------------------------------------------
  docker-image:
    name: Build & push image (Artifact)
    runs-on: ubuntu-latest
    needs: [quality, api-and-security-live, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Deploy + Health Check — SSH into the configured production host, pull
  # the commit that was just built (source-build-on-host, matching
  # scripts/deploy.sh's model — see that script's own comments for why a
  # registry-pull deploy isn't used yet), then verify /api/health/ready
  # actually returns 200 before calling the deploy successful.
  #
  # Deliberately a no-op (not a failure) when DEPLOY_SSH_HOST isn't
  # configured: this repo has no real target host in every environment that
  # runs this workflow (e.g. a fork, or before a first VPS is provisioned),
  # and "no deploy target yet" is a normal, expected state — not a broken
  # pipeline. Configure repository/environment secrets
  # (DEPLOY_SSH_HOST/DEPLOY_SSH_USER/DEPLOY_SSH_KEY) and the `DEPLOY_DOMAIN`/
  # `DEPLOY_PROJECT_DIR` repository variables to turn this on for real.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy + Health Check
    runs-on: ubuntu-latest
    needs: docker-image
    environment: production
    steps:
      - name: Report deploy-target status
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_HOST }}" ]; then
            echo "DEPLOY_SSH_HOST is not configured — skipping deploy (this is expected until a production host is provisioned)."
          else
            echo "Deploy target configured — proceeding."
          fi

      - name: Deploy over SSH
        if: ${{ secrets.DEPLOY_SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROJECT_DIR: ${{ vars.DEPLOY_PROJECT_DIR }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd ${PROJECT_DIR:-/opt/marketing-saas} && git fetch --all --quiet && git checkout ${{ github.sha }} && ./scripts/deploy.sh"

      - name: Post-deploy health check
        if: ${{ secrets.DEPLOY_SSH_HOST != '' }}
        env:
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/api/health/ready" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Healthy (HTTP $CODE) after deploying ${{ github.sha }}"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed after deploy — app never returned 200 from /api/health/ready. Check server logs; consider running the Rollback workflow."
          exit 1
