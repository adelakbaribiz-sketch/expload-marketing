# ============================================================================
# Docker Compose for Development — PostgreSQL + Redis only
# ============================================================================
# Starts PostgreSQL and Redis for local development.
# The Next.js app runs on the host with `bun run dev`.
#
# Usage:
#   docker compose up -d    # Start postgres + redis
#   docker compose down      # Stop
# ============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: marketing-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: marketing_dev
      POSTGRES_DB: marketing_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketing-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
