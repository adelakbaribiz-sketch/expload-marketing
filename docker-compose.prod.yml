# ============================================================================
# Docker Compose for Expload Marketing SaaS — Production Setup
# ============================================================================
# Services:
#   - app: Next.js production server (port 3000)
#   - postgres: PostgreSQL 15 database (port 5432)
#   - redis: Redis 7 for job queue (port 6379)
#
# Usage:
#   1. Copy .env.production.example to .env.production and fill in values
#   2. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   3. Run migrations: docker compose exec app npx prisma migrate deploy
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: marketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketing_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-marketing_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketing} -d ${POSTGRES_DB:-marketing_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing-network

  # --------------------------------------------------------------------------
  # Redis (Job Queue + Caching)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: marketing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketing-network

  # --------------------------------------------------------------------------
  # Next.js Application
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketing}:${POSTGRES_PASSWORD:-marketing_secret_change_me}@postgres:5432/${POSTGRES_DB:-marketing_saas}?schema=public

      # Redis
      REDIS_URL: redis://redis:6379

      # Auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      # Serper API (optional)
      SERPER_API_KEY: ${SERPER_API_KEY:-}

      # Playwright (optional)
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-false}
      PLAYWRIGHT_EXTRACT_REVIEWS: ${PLAYWRIGHT_EXTRACT_REVIEWS:-false}

      # SIEM (optional)
      SIEM_WEBHOOK_URL: ${SIEM_WEBHOOK_URL:-}
    ports:
      - "3000:3000"
    networks:
      - marketing-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  marketing-network:
    driver: bridge
